<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sixtus Madu | Digital Resume</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">

            <a href="#" class="navbar-brand">Sixtus Madu</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
                aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a href="#home" class="nav-link active" aria-current="page">Home</a>
                    </li>

                    <li class="nav-item">
                        <a href="#skills" class="nav-link">Skills</a>
                    </li>

                    <li class="nav-item">
                        <a href="#contact" class="nav-link">Contact</a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <div class="container" id="home">

        <h1>Sixtus Madu</h1>

        <p>Computer Information Technology Student</p>

    </div>


    <div class="container" id="skills">

        <h2>Skills</h2>

        <div class="row">

            <div class="col-12 col-md-4">
                <h3>Web Development</h3>
                <p>HTML, CSS, JavaScript, and Bootstrap.</p>
            </div>

            <div class="col-12 col-md-4">
                <h3>IT Support</h3>
                <p>Windows, hardware, networking, and troubleshooting.</p>
            </div>

            <div class="col-12 col-md-4">
                <h3>Databases</h3>
                <p>SQL, SQLite, and database fundamentals.</p>
            </div>

        </div>

    </div>


    <div class="container" id="contact">

        <h2>Contact Me</h2>

        <form action="">

            <label for="name" class="form-label">
                Name
            </label>

            <input type="text" id="name" class="form-control">


            <label for="email" class="form-label">
                Email
            </label>

            <input type="email" id="email" class="form-control">


            <label for="reason" class="form-label">
                Reason for Contact
            </label>

            <select id="reason" class="form-select">
                <option value="">Select an option</option>
                <option value="job">Job Opportunity</option>
                <option value="project">Project</option>
                <option value="other">Other</option>
            </select>


            <button class="btn btn-primary" type="submit">
                Submit
            </button>

        </form>

    </div>


</body>

</html>
